# web/을 GitHub Pages에 배포한다. 테슬라 브라우저 자체 테스트 페이지(selftest.html)를
# Pi 없이 HTTPS로 열기 위한 용도. 저장소 Settings › Pages › Source를 "GitHub Actions"로 한 번 설정해야 한다.
name: Deploy web to GitHub Pages

# Pages를 켜기 전에는 실패하므로 수동 실행만 한다. 직접 호스팅한다면 쓰지 않아도 된다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w shared && npm run build -w web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
