# Tesla가 접속할 Pi의 Wi-Fi AP. /etc/hostapd/hostapd.conf 로 복사.
interface=wlan0
driver=nl80211
ssid=TeslaMediator
# 5GHz: 지연과 간섭이 적다. 국가 코드를 실제 사용 국가로 맞출 것.
country_code=KR
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# setup-pi.sh가 실제 비밀번호로 바꾼다.
wpa_passphrase=CHANGE_ME_PASSWORD
